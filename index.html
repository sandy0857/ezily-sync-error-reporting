<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ezily 同步錯誤回報 | Sync Error Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      color: #1a1a2e;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-dot {
      width: 32px; height: 32px;
      background: #7c3aed;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-dot span { color: white; font-weight: 800; font-size: 16px; }
    .logo-name { font-size: 20px; font-weight: 700; color: #1a1a2e; }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }

    .card-header { margin-bottom: 32px; }
    .card-header h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .card-header h2 { font-size: 14px; font-weight: 400; color: #6b7280; }
    .divider { height: 3px; width: 40px; background: #7c3aed; border-radius: 2px; margin: 12px 0 16px; }

    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: #374151; margin-bottom: 6px;
    }
    label .en { font-weight: 400; color: #9ca3af; margin-left: 4px; }
    label .required { color: #e84545; margin-left: 2px; }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      background: white;
      transition: border-color 0.15s;
      outline: none;
      font-family: inherit;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
    }
    textarea { resize: vertical; min-height: 100px; }

    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-option {
      flex: 1; min-width: 120px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: #374151;
    }
    .radio-option:has(input:checked) {
      border-color: #7c3aed;
      background: #f5f3ff;
      color: #7c3aed;
    }
    .radio-option input { display: none; }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
      font-family: inherit;
    }
    .submit-btn:hover { background: #6d28d9; }
    .submit-btn:disabled { background: #c4b5fd; cursor: not-allowed; }

    .success {
      display: none;
      text-align: center;
      padding: 32px 0;
    }
    .success .icon {
      width: 56px; height: 56px;
      background: #f0fdf4;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .success h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .success p { font-size: 14px; color: #6b7280; }
    .reset-btn {
      margin-top: 20px;
      background: none;
      border: 1.5px solid #7c3aed;
      color: #7c3aed;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="logo">
  <div class="logo-dot"><span>E</span></div>
  <span class="logo-name">Ezily</span>
</div>

<div class="card">
  <div id="form-view">
    <div class="card-header">
      <h1>同步錯誤回報</h1>
      <h2>Sync Error Report</h2>
      <div class="divider"></div>
      <p style="font-size:13px;color:#6b7280;">請填寫以下資訊，協助工程師追查同步錯誤。<br>Please fill in the details below to help our engineers investigate.</p>
    </div>

    <div class="error-msg" id="error-msg">請填寫所有必填欄位 | Please fill in all required fields.</div>

    <!-- 1. Marketplace -->
    <div class="field">
      <label>平台 <span class="en">| Marketplace</span><span class="required">*</span></label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="marketplace" value="Shopee 蝦皮" />
          🛒 Shopee 蝦皮
        </label>
        <label class="radio-option">
          <input type="radio" name="marketplace" value="Momo" />
          🛍 Momo
        </label>
      </div>
    </div>

    <!-- 2. Sync Type -->
    <div class="field">
      <label>同步類型 <span class="en">| Sync Type</span><span class="required">*</span></label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="synctype" value="商品同步 Product Sync" />
          📦 商品同步 Product
        </label>
        <label class="radio-option">
          <input type="radio" name="synctype" value="庫存分配同步 Allocation Sync" />
          📊 庫存分配 Allocation
        </label>
      </div>
    </div>

    <!-- 3. SKU -->
    <div class="field">
      <label>SKU 或商品編號 <span class="en">| SKU or Product ID</span><span class="required">*</span></label>
      <input type="text" id="sku" placeholder="例如 / e.g. 641502171916" />
    </div>

    <!-- 4. Product Name -->
    <div class="field">
      <label>商品名稱 <span class="en">| Product Name</span><span class="required">*</span></label>
      <input type="text" id="product-name" placeholder="輸入商品名稱 | Enter product name" />
    </div>

    <!-- 5. Error Message -->
    <div class="field">
      <label>錯誤訊息 <span class="en">| Error Message</span><span class="required">*</span></label>
      <textarea id="error-message" placeholder="請複製並貼上完整的錯誤訊息&#10;Please copy and paste the full error message"></textarea>
    </div>

    <!-- 6. Description (optional) -->
    <div class="field">
      <label>補充說明 <span class="en">| Additional Description</span></label>
      <textarea id="description" placeholder="選填：如有其他補充說明請填寫&#10;Optional: any additional context" style="min-height:80px;"></textarea>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitForm()">
      提交回報 | Submit Report
    </button>
  </div>

  <div class="success" id="success-view">
    <div class="icon">✅</div>
    <h3>回報已送出！| Report Submitted!</h3>
    <p>感謝您的回報，Ezily 工程師將盡快跟進。<br>Thank you. Our engineers will follow up shortly.</p>
    <button class="reset-btn" onclick="resetForm()">再次回報 | Submit Another</button>
  </div>
</div>

<script>
  // Answers go straight into the Google Form (no Apps Script in between).
  const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSdSLn0KLSFMZ4kZAbmoWdPG7NVk10kc5zM27RXvu8kHftErqw/formResponse';
  const ENTRY = {
    marketplace:  'entry.1271836848',
    synctype:     'entry.18404117',
    sku:          'entry.417165185',
    productName:  'entry.1222789454',
    errorMessage: 'entry.176714856',
    description:  'entry.843791455',
  };
  let sending = false;

  async function submitForm() {
    if (sending) return;  // ignore repeat taps while sending
    const marketplace = document.querySelector('input[name="marketplace"]:checked');
    const synctype    = document.querySelector('input[name="synctype"]:checked');
    const sku         = document.getElementById('sku').value.trim();
    const productName = document.getElementById('product-name').value.trim();
    const errorMsg    = document.getElementById('error-message').value.trim();
    const description = document.getElementById('description').value.trim();
    const errDiv      = document.getElementById('error-msg');

    if (!marketplace || !synctype || !sku || !productName || !errorMsg) {
      errDiv.textContent = '請填寫所有必填欄位 | Please fill in all required fields.';
      errDiv.style.display = 'block';
      return;
    }
    errDiv.style.display = 'none';

    sending = true;
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '送出中... | Submitting...';

    const body = new URLSearchParams();
    body.append(ENTRY.marketplace, marketplace.value);
    body.append(ENTRY.synctype, synctype.value);
    body.append(ENTRY.sku, sku);
    body.append(ENTRY.productName, productName);
    body.append(ENTRY.errorMessage, errorMsg);
    if (description) body.append(ENTRY.description, description);

    try {
      await fetch(FORM_ACTION, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
      });
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      window.scrollTo(0, 0);
    } catch (err) {
      errDiv.textContent = '送出失敗，請確認網路連線後再試一次 | Submission failed, please check your connection and try again.';
      errDiv.style.display = 'block';
    } finally {
      sending = false;
      btn.disabled = false;
      btn.textContent = '提交回報 | Submit Report';
    }
  }

  function resetForm() {
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    ['sku','product-name','error-message','description'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('form-view').style.display = 'block';
    document.getElementById('success-view').style.display = 'none';
  }
</script>
</body>
</html>
